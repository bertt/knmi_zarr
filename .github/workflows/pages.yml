name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Download latest KNMI file
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: |
          f=$(uv run --with requests python download.py)
          echo "NC_FILE=$f" >> "$GITHUB_ENV"
      - name: Convert NetCDF to GeoParquet
        run: uv run --with xarray --with netcdf4 --with geopandas --with pyarrow --with numpy python convert.py "$NC_FILE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
